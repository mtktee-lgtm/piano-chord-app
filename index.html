<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Explorer — Piano & Guitar</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0e10;
  --bg2: #161618;
  --bg3: #1e1e22;
  --surface: #252528;
  --border: #2e2e34;
  --border2: #3a3a42;
  --text: #f0f0f2;
  --text2: #9090a0;
  --text3: #5a5a6a;
  --blue: #4d9eff;
  --blue2: #1a6ad4;
  --green: #3ecf8e;
  --amber: #f0b429;
  --red: #ff5f5f;
  --mono: 'Space Mono', monospace;
  --thai: 'Noto Sans Thai', sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { background:var(--bg); color:var(--text); font-family:var(--thai); }
body { min-height:100vh; padding:0 0 4rem; }

/* HEADER */
.header {
  padding: 1.5rem 2rem 1rem;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 1rem;
}
.logo { font-family:var(--mono); font-size:18px; font-weight:700; color:var(--text); letter-spacing:-1px; }
.logo span { color:var(--blue); }
.tagline { font-size:12px; color:var(--text3); font-family:var(--mono); }

/* TABS */
.tabs {
  display: flex; gap:0; padding: 0 2rem;
  border-bottom: 1px solid var(--border);
}
.tab {
  padding: .75rem 1.5rem;
  font-size: 13px; font-family:var(--mono);
  color: var(--text3); cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all .15s; user-select:none;
}
.tab.active { color:var(--blue); border-bottom-color:var(--blue); }
.tab:hover:not(.active) { color:var(--text2); }

/* PANELS */
.panel { display:none; padding:1.5rem 2rem; }
.panel.active { display:block; }

/* CONTROLS */
.ctrl-grid { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:1rem; }
.cg { display:flex; flex-direction:column; gap:4px; }
.cg label { font-size:11px; color:var(--text3); font-family:var(--mono); letter-spacing:.5px; text-transform:uppercase; }
select {
  background:var(--surface); color:var(--text);
  border:1px solid var(--border2); border-radius:6px;
  padding:6px 10px; font-size:13px;
  font-family:var(--thai); cursor:pointer;
  min-width:110px;
}
select:focus { outline:none; border-color:var(--blue); }

/* TOGGLE BUTTONS */
.trow { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:1rem; }
.tbtn {
  font-size:11px; font-family:var(--mono);
  padding:4px 10px; border-radius:4px;
  border:1px solid var(--border2);
  background:var(--surface); color:var(--text3);
  cursor:pointer; transition:all .12s;
}
.tbtn.on { background:var(--blue2); color:var(--blue); border-color:var(--blue2); }

/* CHORD INFO BAR */
.chord-bar {
  display:flex; align-items:baseline; gap:12px;
  margin-bottom:1rem; flex-wrap:wrap;
}
.chord-name { font-family:var(--mono); font-size:24px; font-weight:700; color:var(--text); }
.chord-notes { font-size:13px; color:var(--text2); }
.note-tag {
  display:inline-block; font-size:11px; font-family:var(--mono);
  padding:2px 8px; border-radius:3px; margin:0 2px;
}
.nt-root { background:#1a3a5c; color:var(--blue); }
.nt-chord { background:var(--surface); color:var(--text3); border:1px solid var(--border); }
.nt-ext { background:#1a3a28; color:var(--green); }

/* DIAGRAMS */
.diagrams-row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:1rem; }
.dw { display:flex; flex-direction:column; align-items:center; cursor:pointer; }
.dw .dlabel { font-size:10px; font-family:var(--mono); color:var(--text3); margin-top:4px; text-align:center; }
.dw.sel .dlabel { color:var(--blue); }

/* INFO CARDS */
.info-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:1rem; }
.ic {
  background:var(--surface); border:1px solid var(--border);
  border-radius:6px; padding:.6rem .9rem;
}
.il { font-size:10px; font-family:var(--mono); color:var(--text3); margin-bottom:3px; text-transform:uppercase; letter-spacing:.5px; }
.iv { font-size:13px; color:var(--text2); line-height:1.4; }

/* WARN */
.warn { font-size:12px; color:var(--amber); margin-bottom:.6rem; font-family:var(--mono); min-height:16px; }

/* EXTENSION BUTTONS */
.ext-row { display:flex; gap:6px; margin-bottom:.75rem; }
.ext-btn {
  font-size:12px; font-family:var(--mono);
  padding:4px 12px; border-radius:4px;
  border:1px solid var(--border2);
  background:var(--surface); color:var(--text3);
  cursor:pointer; transition:all .12s;
}
.ext-btn.active { background:#1a3a28; color:var(--green); border-color:#2a5a3a; }
.ext-btn.warn { background:#3a2a0a; color:var(--amber); border-color:#5a4010; }

/* SECTION DIVIDER */
.sdiv {
  border-top:1px solid var(--border); margin:1.5rem 0 1rem;
  padding-top:1rem;
}
.sdiv-label { font-size:11px; font-family:var(--mono); color:var(--text3); text-transform:uppercase; letter-spacing:1px; margin-bottom:.75rem; }

/* VOICE LEADING */
.vl-ab { display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap; margin-bottom:.75rem; }
.vl-chord-wrap { display:flex; flex-direction:column; align-items:center; }
.vl-chord-label { font-size:11px; font-family:var(--mono); color:var(--text3); margin-top:4px; }
.swap-btn {
  font-size:16px; padding:6px 10px; margin-top:40px;
  background:var(--surface); border:1px solid var(--border2);
  color:var(--text3); border-radius:6px; cursor:pointer;
}
.swap-btn:hover { color:var(--blue); }
.vl-table { width:100%; border-collapse:collapse; font-size:12px; }
.vl-table td { padding:4px 8px; border-bottom:1px solid var(--border); }
.vl-table td:first-child { font-family:var(--mono); color:var(--text3); font-size:11px; width:60px; }
.vl-table td:nth-child(2) { color:var(--text2); font-family:var(--mono); }
.vl-table td:nth-child(3) { color:var(--text3); }
.vl-table td:nth-child(4) { color:var(--blue); font-family:var(--mono); }
.badge { font-size:10px; padding:2px 6px; border-radius:3px; font-family:var(--mono); }
.badge-easy { background:#1a3a28; color:var(--green); }
.badge-mid { background:#2a2a0a; color:var(--amber); }
.badge-hard { background:#3a1a1a; color:var(--red); }
.vl-summary { font-size:11px; font-family:var(--mono); color:var(--text3); margin-top:.5rem; padding:.4rem .5rem; background:var(--surface); border-radius:4px; }

/* KEYBOARD */
.keyboard-wrap { margin-bottom:1rem; overflow-x:auto; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="logo">CHORD<span>.</span>EX</div>
    <div class="tagline">Piano & Guitar Explorer</div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('piano',this)">Piano</div>
  <div class="tab" onclick="switchTab('guitar',this)">Guitar</div>
</div>

<!-- PIANO PANEL -->
<div class="panel active" id="panel-piano">
  <div class="ctrl-grid">
    <div class="cg"><label>Root</label>
      <select id="p-root">
        <option>C</option><option>C#/Db</option><option>D</option><option>D#/Eb</option>
        <option>E</option><option>F</option><option>F#/Gb</option><option>G</option>
        <option>G#/Ab</option><option>A</option><option>A#/Bb</option><option>B</option>
      </select></div>
    <div class="cg"><label>Quality</label>
      <select id="p-quality">
        <option value="maj7">maj7</option><option value="maj9">maj9</option>
        <option value="m7">m7</option><option value="m9">m9</option>
        <option value="7">dom7</option><option value="sus4">sus4</option>
        <option value="m7b5">m7b5</option><option value="dim7">dim7</option>
        <option value="maj">major</option><option value="min">minor</option>
      </select></div>
    <div class="cg"><label>Inversion</label>
      <select id="p-inv">
        <option value="0">Root</option><option value="1">1st</option>
        <option value="2">2nd</option><option value="3">3rd</option>
      </select></div>
    <div class="cg"><label>Voicing</label>
      <select id="p-voicing">
        <option value="close">Close</option>
        <option value="rootless">Rootless R&B</option>
        <option value="spread">Spread</option>
      </select></div>
  </div>

  <div style="font-size:11px;font-family:var(--mono);color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">Extension</div>
  <div class="ext-row" id="p-ext-row"></div>
  <div class="warn" id="p-warn"></div>

  <div class="chord-bar">
    <div class="chord-name" id="p-chord-name">Cmaj7</div>
    <div id="p-note-tags"></div>
  </div>

  <div class="keyboard-wrap">
    <svg id="p-piano" viewBox="0 0 560 110" style="width:100%;max-width:560px;height:110px;display:block;"></svg>
  </div>

  <div class="info-row">
    <div class="ic"><div class="il">Bass note</div><div class="iv" id="p-bass-note">C</div></div>
    <div class="ic"><div class="il">Notes low → high</div><div class="iv" id="p-notes-lh"></div></div>
  </div>

  <div class="sdiv">
    <div class="sdiv-label">All inversions</div>
    <div id="p-inv-cards" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
  </div>
</div>

<!-- GUITAR PANEL -->
<div class="panel" id="panel-guitar">
  <div class="ctrl-grid">
    <div class="cg"><label>Root</label>
      <select id="g-root">
        <option>C</option><option>C#/Db</option><option>D</option><option>D#/Eb</option>
        <option>E</option><option>F</option><option>F#/Gb</option><option>G</option>
        <option>G#/Ab</option><option>A</option><option>A#/Bb</option><option>B</option>
      </select></div>
    <div class="cg"><label>Quality</label>
      <select id="g-quality">
        <option value="maj">major</option><option value="min">minor</option>
        <option value="maj7">maj7</option><option value="m7">m7</option>
        <option value="7">dom7</option><option value="sus4">sus4</option>
        <option value="sus2">sus2</option><option value="add9">add9</option>
        <option value="maj9">maj9</option><option value="m9">m9</option>
        <option value="m7b5">m7b5</option><option value="dim7">dim7</option>
        <option value="aug">aug</option>
      </select></div>
    <div class="cg"><label>Bass/Slash</label>
      <select id="g-bass">
        <option value="">— none</option>
        <option>C</option><option>C#/Db</option><option>D</option><option>D#/Eb</option>
        <option>E</option><option>F</option><option>F#/Gb</option><option>G</option>
        <option>G#/Ab</option><option>A</option><option>A#/Bb</option><option>B</option>
      </select></div>
    <div class="cg"><label>Capo</label>
      <select id="g-capo">
        <option value="0">No capo</option>
        <option value="1">Capo 1</option><option value="2">Capo 2</option>
        <option value="3">Capo 3</option><option value="4">Capo 4</option>
        <option value="5">Capo 5</option>
      </select></div>
  </div>

  <div class="trow">
    <button class="tbtn on" id="tb-finger" onclick="toggleG('finger',this)">Finger numbers</button>
    <button class="tbtn on" id="tb-notename" onclick="toggleG('notename',this)">Note names</button>
    <button class="tbtn" id="tb-allpos" onclick="toggleG('allpos',this)">All positions</button>
  </div>

  <div class="chord-bar">
    <div class="chord-name" id="g-chord-name">C</div>
    <div style="font-size:13px;color:var(--text2)" id="g-notes-str"></div>
  </div>

  <div class="diagrams-row" id="g-diagrams"></div>
  <div class="info-row">
    <div class="ic"><div class="il">Notes</div><div class="iv" id="g-notes"></div></div>
    <div class="ic"><div class="il">Tip</div><div class="iv" id="g-tip"></div></div>
  </div>

  <div class="sdiv">
    <div class="sdiv-label">Voice leading A → B</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:.75rem;align-items:flex-end;">
      <div class="cg"><label>Chord A</label>
        <select id="vl-rA" onchange="renderVL()">
          <option>C</option><option>C#/Db</option><option>D</option><option>D#/Eb</option>
          <option>E</option><option>F</option><option>F#/Gb</option><option>G</option>
          <option>G#/Ab</option><option>A</option><option>A#/Bb</option><option>B</option>
        </select></div>
      <div class="cg"><label>&nbsp;</label>
        <select id="vl-qA" onchange="renderVL()">
          <option value="maj">major</option><option value="min">minor</option>
          <option value="maj7">maj7</option><option value="m7">m7</option>
          <option value="7">dom7</option><option value="sus4">sus4</option>
        </select></div>
      <button class="swap-btn" onclick="swapVL()">⇄</button>
      <div class="cg"><label>Chord B</label>
        <select id="vl-rB" onchange="renderVL()">
          <option>C</option><option>C#/Db</option><option>D</option><option>D#/Eb</option>
          <option>E</option><option>F</option><option>F#/Gb</option><option>G</option>
          <option>G#/Ab</option><option>A</option><option>A#/Bb</option><option>B</option>
        </select></div>
      <div class="cg"><label>&nbsp;</label>
        <select id="vl-qB" onchange="renderVL()">
          <option value="min">minor</option><option value="maj">major</option>
          <option value="maj7">maj7</option><option value="m7">m7</option>
          <option value="7">dom7</option><option value="sus4">sus4</option>
        </select></div>
    </div>
    <div id="vl-content"></div>
  </div>
</div>

<script>
// ─── SHARED ───────────────────────────────────────────────────────────
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NF={'C#':'Db','D#':'Eb','F#':'Gb','G#':'Ab','A#':'Bb'};
const fn=n=>NF[n]||n;
function ni(n){const map={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'};const x=n.split('/')[0];return NOTES.indexOf(map[x]||x);}

// ─── PIANO ────────────────────────────────────────────────────────────
const P_QUAL={maj7:[0,4,7,11],maj9:[0,4,7,11,14],m7:[0,3,7,10],m9:[0,3,7,10,14],7:[0,4,7,10],sus4:[0,5,7,10],m7b5:[0,3,6,10],dim7:[0,3,6,9],maj:[0,4,7],min:[0,3,7]};
const P_EXT={7:10,9:14,11:17,13:21};
const P_LABELS={maj7:'maj7',maj9:'maj9',m7:'m7',m9:'m9',7:'7',sus4:'sus4',m7b5:'m7b5',dim7:'dim7',maj:'',min:'m'};
const OPEN_STR=[4,9,2,7,11,4];
let pExt=new Set();

function pChordNotes(root,qual,ext){
  const ri=ni(root);
  let iv=[...(P_QUAL[qual]||[0,4,7])];
  const bs=new Set(iv.map(i=>i%12));
  ext.forEach(e=>{const v=P_EXT[e];if(v!==undefined&&!bs.has(v%12)){iv.push(v);bs.add(v%12);}});
  iv.sort((a,b)=>a-b);
  return iv.map(i=>({name:NOTES[(ri+i)%12],midi:60+i,iv:i}));
}
function applyInv(notes,inv){
  if(inv===0)return notes;
  let a=[...notes];
  for(let i=0;i<inv&&i<a.length-1;i++){
    let n=a.shift();
    while(n.midi<=a[a.length-1].midi)n={...n,midi:n.midi+12};
    a.push(n);
  }
  return a;
}
function applyVoicing(notes,style){
  if(style==='rootless'){
    const a=notes.filter(n=>n.iv%12!==0);
    if(!a.length)return notes;
    return a;
  }
  if(style==='spread'){
    let a=[...notes];
    for(let i=1;i<a.length;i++){
      while(a[i].midi-a[i-1].midi<5)a[i]={...a[i],midi:a[i].midi+12};
    }
    return a;
  }
  return notes;
}
function pWarn(qual,ext){
  const msgs=[];
  if(ext.has(11)&&(qual==='maj7'||qual==='maj9'||qual==='maj'))msgs.push('11th ชนกับ 3rd ใน major — ฟังขัด');
  if(ext.has(13)&&qual==='m7b5')msgs.push('13th ไม่เหมาะกับ m7b5');
  return msgs.join(' · ');
}

function drawPiano(midis){
  const svg=document.getElementById('p-piano');
  const WW=32,WH=100,BW=20,BH=62;
  const START=48;
  const whitePC=[0,2,4,5,7,9,11];
  const blackPC=[1,3,null,6,8,10,null];
  let h='';
  for(let o=0;o<2;o++){
    const base=START+o*12;
    whitePC.forEach((pc,wi)=>{
      const x=o*7*WW+wi*WW;
      const midi=base+pc;
      const hl=midis.some(m=>m%12===pc);
      const isRoot=hl&&midis[0]%12===pc;
      const fill=hl?(isRoot?'#4d9eff':'#3ecf8e'):'#e8e8ec';
      h+=`<rect x="${x+1}" y="2" width="${WW-2}" height="${WH-2}" rx="3" fill="${fill}" stroke="#555" stroke-width="0.5"/>`;
      if(hl){
        const nn=fn(NOTES[pc]);
        h+=`<text x="${x+WW/2}" y="${WH-8}" text-anchor="middle" font-size="9" fill="${isRoot?'white':'#0e2a1a'}" font-weight="bold">${nn}</text>`;
      }
    });
  }
  for(let o=0;o<2;o++){
    const base=START+o*12;
    blackPC.forEach((pc,wi)=>{
      if(pc===null)return;
      const x=o*7*WW+wi*WW+WW-BW/2+2;
      const hl=midis.some(m=>m%12===pc);
      const isRoot=hl&&midis[0]%12===pc;
      const fill=hl?(isRoot?'#1a6ad4':'#0f6e56'):'#1a1a1e';
      h+=`<rect x="${x}" y="2" width="${BW}" height="${BH}" rx="2" fill="${fill}"/>`;
      if(hl){const nn=fn(NOTES[pc]);h+=`<text x="${x+BW/2}" y="${BH-6}" text-anchor="middle" font-size="7.5" fill="white" font-weight="bold">${nn}</text>`;}
    });
  }
  svg.innerHTML=h;
}

function renderPiano(){
  const root=document.getElementById('p-root').value;
  const qual=document.getElementById('p-quality').value;
  const inv=parseInt(document.getElementById('p-inv').value);
  const voic=document.getElementById('p-voicing').value;

  document.getElementById('p-warn').textContent=pWarn(qual,pExt);

  let notes=pChordNotes(root,qual,pExt);
  notes=applyInv(notes,inv);
  notes=applyVoicing(notes,voic);

  drawPiano(notes.map(n=>n.midi));

  const ql=P_LABELS[qual];
  const extStr=[...pExt].sort((a,b)=>a-b).map(e=>`(${e})`).join('');
  document.getElementById('p-chord-name').textContent=fn(root.split('/')[0])+ql+extStr;
  document.getElementById('p-bass-note').textContent=fn(notes[0].name)+(inv>0?' — '+['','3rd','5th','7th'][inv]+' bass':'');
  document.getElementById('p-notes-lh').textContent=notes.map(n=>fn(n.name)).join(' · ');

  const tagsEl=document.getElementById('p-note-tags');
  const rootPc=ni(root)%12;
  tagsEl.innerHTML=notes.map(n=>{
    const isRoot=n.iv%12===0;
    const isExt=n.iv>=10;
    const cls=isRoot?'nt-root':isExt?'nt-ext':'nt-chord';
    return `<span class="note-tag ${cls}">${fn(n.name)}</span>`;
  }).join('');

  const maxInv=Math.min(notes.length-1,3);
  const cardsEl=document.getElementById('p-inv-cards');
  cardsEl.innerHTML='';
  for(let ii=0;ii<=maxInv;ii++){
    let invN=pChordNotes(root,qual,pExt);
    invN=applyInv(invN,ii);
    invN=applyVoicing(invN,voic);
    const labels=['Root pos','1st inv','2nd inv','3rd inv'];
    const card=document.createElement('div');
    card.style.cssText='background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.5rem .75rem;cursor:pointer;min-width:100px;';
    if(ii===inv)card.style.borderColor='var(--blue)';
    card.innerHTML=`<div style="font-size:10px;font-family:var(--mono);color:var(--text3);margin-bottom:2px">${labels[ii]}</div><div style="font-size:12px;font-family:var(--mono);color:var(--blue)">${invN.map(n=>fn(n.name)).join(' ')}</div><div style="font-size:11px;color:var(--text3)">bass: ${fn(invN[0].name)}</div>`;
    card.onclick=()=>{document.getElementById('p-inv').value=ii;renderPiano();};
    cardsEl.appendChild(card);
  }

  updateExtBtns(qual);
}

function updateExtBtns(qual){
  document.querySelectorAll('.ext-btn').forEach(btn=>{
    const e=parseInt(btn.dataset.ext);
    const isWarn=(e===11&&(qual==='maj7'||qual==='maj9'||qual==='maj'))||(e===13&&qual==='m7b5');
    btn.className='ext-btn'+(pExt.has(e)?' active':'')+(isWarn?' warn':'');
  });
}

function initExtBtns(){
  const row=document.getElementById('p-ext-row');
  [7,9,11,13].forEach(e=>{
    const btn=document.createElement('button');
    btn.className='ext-btn';btn.textContent=e;btn.dataset.ext=e;
    btn.onclick=()=>{pExt.has(e)?pExt.delete(e):pExt.add(e);renderPiano();};
    row.appendChild(btn);
  });
}

function gShapeKey(root,qual){
  const m={'C#/Db':'Db','D#/Eb':'Eb','F#/Gb':'Gb','G#/Ab':'Ab','A#/Bb':'Bb'};
  const r=m[root]||root;
  return r+'_'+qual;
}
function gChordNotes(root,qual){
  const ri=ni(root);
  return (G_QUAL[qual]||[0,4,7]).map(i=>NOTES[(ri+i)%12]);
}

function makeGSVG(shape,fi,root,qual,isSel,bassNote){
  const W=86,H=124;
  const strings=6,frets=5;
  const PL=18,PT=22,PR=6;
  const sw=(W-PL-PR)/(strings-1);
  const fh=(H-PT-12)/frets;
  const frets_used=shape.filter(f=>f>0);
  const minF=frets_used.length?Math.min(...frets_used):1;
  const isOpen=minF<=1;
  const startF=isOpen?1:minF;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
  s+=`<rect x="0.5" y="0.5" width="${W-1}" height="${H-1}" rx="6" fill="${isSel?'#1a2a3a':'#1e1e22'}" stroke="${isSel?'#4d9eff':'#2e2e34'}" stroke-width="${isSel?'1.5':'1'}"/>`;
  if(isOpen)s+=`<rect x="${PL}" y="${PT}" width="${W-PL-PR}" height="3" rx="1" fill="#9090a0"/>`;
  else s+=`<text x="${PL-3}" y="${PT+fh/2+4}" text-anchor="end" font-size="8" fill="#5a5a6a">${startF}</text>`;
  for(let f=0;f<=frets;f++){const y=PT+(isOpen?3:0)+f*fh;s+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#2e2e34" stroke-width="0.5"/>`;}
  for(let st=0;st<strings;st++){const x=PL+st*sw;s+=`<line x1="${x}" y1="${PT}" x2="${x}" y2="${PT+(isOpen?3:0)+frets*fh}" stroke="#3a3a42" stroke-width="0.75"/>`;}
  const rootPc=ni(root)%12;
  shape.forEach((fret,si)=>{
    const x=PL+si*sw;
    if(fret===-1){s+=`<text x="${x}" y="${PT-8}" text-anchor="middle" font-size="10" fill="#5a5a6a">×</text>`;}
    else if(fret===0){s+=`<circle cx="${x}" cy="${PT-8}" r="4" fill="none" stroke="#5a5a6a" stroke-width="1"/>`;}
    else{
      const df=fret-startF;
      const cy=PT+(isOpen?3:0)+df*fh+fh/2;
      const notePc=(G_OPEN[si]+fret)%12;
      const isRoot=notePc===rootPc;
      const isBassNote=bassNote&&notePc===ni(bassNote)%12&&si===shape.reduce((mi,f,i)=>f>=0&&i<mi?i:mi,6);const fill=isRoot?'#4d9eff':isBassNote?'#f0b429':'#3ecf8e';
      s+=`<circle cx="${x}" cy="${cy}" r="9" fill="${fill}"/>`;
      if(gOpts.notename){
        const nn=fn(NOTES[notePc]);
        s+=`<text x="${x}" y="${cy+4}" text-anchor="middle" font-size="7" fill="${isRoot?'white':'#0e2a1a'}" font-weight="bold">${nn}</text>`;
      } else if(gOpts.finger&&fi&&fi[si]){
        s+=`<text x="${x}" y="${cy+4}" text-anchor="middle" font-size="9" fill="white" font-weight="bold">${fi[si]}</text>`;
      }
      if(gOpts.finger&&fi&&fi[si]&&gOpts.notename){
        s+=`<text x="${x+11}" y="${cy+3}" font-size="8" fill="#5a5a6a">${fi[si]}</text>`;
      }
    }
  });
  s+=`</svg>`;
  return s;
}

function renderGuitar(){
  const root=document.getElementById('g-root').value;
  const qual=document.getElementById('g-quality').value;
  const bass=document.getElementById('g-bass').value;
  const capo=parseInt(document.getElementById('g-capo').value)||0;
  const ql=G_LABELS[qual]||qual;
  const bassStr=bass?'/'+fn(bass.split('/')[0]):'';
  const capoStr=capo>0?` capo${capo}`:'';
  document.getElementById('g-chord-name').textContent=fn(root.split('/')[0])+ql+bassStr+capoStr;
  const notes=gChordNotes(root,qual);
  document.getElementById('g-notes-str').textContent=notes.map(fn).join(' · ');
  document.getElementById('g-notes').textContent=notes.map(fn).join(' · ');
  // slash chord first
  let shapes=[];
  if(bass){
    const bNote=fn(bass.split("/")[0]);
    const slashKey=gShapeKey(root,qual)+"/"+bNote;
    if(SLASH_DB[slashKey])shapes=SLASH_DB[slashKey];
  }
  if(!shapes.length){
    const key=gShapeKey(root,qual);
    shapes=GDB[key]||[];
  }
  if(!shapes.length){
    const ri=ni(root);
    for(const [k,v] of Object.entries(GDB)){
      if(k.endsWith("_"+qual)){
        const kr=ni(k.split("_")[0]);
        const diff=(ri-kr+12)%12;
        if(diff>0){
          const base=v[0];
          if(base){shapes=[{f:base.f.map(f=>f<0?f:f===0?diff:f+diff),fi:base.fi}];}
          break;
        }
      }
    }
  }
  const show=gOpts.allpos?shapes:shapes.slice(0,3);
  const diagEl=document.getElementById('g-diagrams');
  diagEl.innerHTML='';
  if(!show.length){
    diagEl.innerHTML=`<div style="font-size:12px;color:var(--text3);padding:.5rem 0">ไม่มี shape ในฐานข้อมูล</div>`;
    document.getElementById('g-tip').textContent='—';
    return;
  }
  const posLbls=['Open','Barre','Var 2','Var 3','Var 4'];
  if(selDiag>=show.length)selDiag=0;
  show.forEach((item,idx)=>{
    const shape=item.f||item;const fi=item.fi||null;
    const div=document.createElement('div');
    div.className='dw'+(idx===selDiag?' sel':'');
    div.innerHTML=makeGSVG(shape,fi,root,qual,idx===selDiag,bass)+`<div class="dlabel">${posLbls[idx]||'Pos '+(idx+1)}</div>`;
    div.onclick=()=>{selDiag=idx;renderGuitar();};
    diagEl.appendChild(div);
  });
  const selS=show[selDiag]||show[0];
  const shape=selS.f||selS;
  const fingers=shape.filter(f=>f>0);
  const minF=fingers.length?Math.min(...fingers):0;
  const maxF=fingers.length?Math.max(...fingers):0;
  const isBarre=shape.filter(f=>f===minF&&f>0).length>=3;
  const tips=[];
  if(isBarre)tips.push(`Barre fret ${minF}`);
  if(maxF-minF>3)tips.push('stretch มาก');
  if(shape.includes(-1))tips.push('มีสาย mute');
  if(capo>0)tips.push(`Capo ${capo} +${capo} semitones`);
  if(bass)tips.push(`Bass: ${fn(bass.split('/')[0])}`);
  document.getElementById('g-tip').textContent=tips.length?tips.join(' · '):'กดตามจุด — น้ำเงิน=root, เขียว=โน้ตอื่น';
}

function renderVL(){
  const rA=document.getElementById('vl-rA').value;
  const qA=document.getElementById('vl-qA').value;
  const rB=document.getElementById('vl-rB').value;
  const qB=document.getElementById('vl-qB').value;
  const kA=gShapeKey(rA,qA),kB=gShapeKey(rB,qB);
  const sA=GDB[kA]||[],sB=GDB[kB]||[];
  const el=document.getElementById('vl-content');
  if(!sA.length||!sB.length){el.innerHTML=`<div style="font-size:12px;color:var(--text3)">ไม่มี shape</div>`;return;}
  const shA=sA[0].f||sA[0],shB=sB[0].f||sB[0];
  const fiA=sA[0].fi||null,fiB=sB[0].fi||null;
  const qlA=G_LABELS[qA]||qA,qlB=G_LABELS[qB]||qB;
  let html=`<div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:.75rem">`;
  html+=`<div style="text-align:center">${makeGSVG(shA,fiA,rA,qA,false)}<div style="font-size:11px;font-family:var(--mono);color:var(--text3);margin-top:3px">${fn(rA.split('/')[0])+qlA}</div></div>`;
  html+=`<div style="font-size:20px;color:var(--text3);margin-top:48px">→</div>`;
  html+=`<div style="text-align:center">${makeGSVG(shB,fiB,rB,qB,false)}<div style="font-size:11px;font-family:var(--mono);color:var(--text3);margin-top:3px">${fn(rB.split('/')[0])+qlB}</div></div>`;
  html+=`</div>`;
  const strNames=['E','A','D','G','B','e'];
  let total=0;
  html+=`<table class="vl-table">`;
  for(let s=0;s<6;s++){
    const fA=shA[s],fB=shB[s];
    if(fA<0&&fB<0)continue;
    const nA=fA<0?'×':fA===0?fn(NOTES[G_OPEN[s]%12])+'○':fn(NOTES[(G_OPEN[s]+fA)%12])+` fr${fA}`;
    const nB=fB<0?'×':fB===0?fn(NOTES[G_OPEN[s]%12])+'○':fn(NOTES[(G_OPEN[s]+fB)%12])+` fr${fB}`;
    const diff=(fA<0||fB<0)?null:Math.abs(fB-fA);
    if(diff!==null)total+=diff;
    const move=diff===null?'lift':diff===0?'stay':diff===1?'±1':diff<=2?`±${diff}`:`±${diff}`;
    const cls=diff===null?'':diff===0?'badge-easy':diff<=2?'badge-easy':'badge-hard';
    html+=`<tr><td>${strNames[s]}</td><td>${nA}</td><td style="color:var(--text3)">→</td><td>${nB}</td><td><span class="badge ${cls}">${move}</span></td></tr>`;
  }
  html+=`</table>`;
  const ease=total<=4?'ง่าย':total<=8?'ปานกลาง':total<=12?'ยากนิด':'ยาก';
  const ecls=total<=4?'badge-easy':total<=8?'badge-mid':'badge-hard';
  html+=`<div class="vl-summary">total movement: ${total} frets — <span class="badge ${ecls}">${ease}</span></div>`;
  el.innerHTML=html;
}

function swapVL(){
  const rA=document.getElementById('vl-rA'),rB=document.getElementById('vl-rB');
  const qA=document.getElementById('vl-qA'),qB=document.getElementById('vl-qB');
  [rA.value,rB.value]=[rB.value,rA.value];
  [qA.value,qB.value]=[qB.value,qA.value];
  renderVL();
}

// ─── TABS ─────────────────────────────────────────────────────────────
function switchTab(name,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-'+name).classList.add('active');
}

['p-root','p-quality','p-inv','p-voicing'].forEach(id=>document.getElementById(id).addEventListener('change',()=>renderPiano()));
['g-root','g-quality','g-bass','g-capo'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{selDiag=0;renderGuitar();}));
initExtBtns();
renderPiano();
renderGuitar();
renderVL();
